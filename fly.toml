app = "21lab-scheduler"
primary_region = "nrt"

[build]

[env]
  PORT = "8001"
  NODE_ENV = "production"
  TZ = "Asia/Seoul"
  PLAYWRIGHT_HEADLESS = "true"
  # 2026-08-20: 밀려 있던 예약(대기 12건)과 실패 잡 83건을 전부 비운 뒤 복원을 켰다.
  # 복원이 꺼져 있으면 재시작 때 남아 있던 예약이 통째로 고아가 된다.
  # 다시 끌 일이 생기면 큐를 먼저 비우고 끄지 않으면, 켤 때 과거 예약이 한꺼번에 나간다.

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # 큐 워커가 항상 살아 있어야 예약 시각에 발행이 돈다.
  min_machines_running = 1

  [http_service.http_options.response.headers]
    # 큐 대시보드가 검색엔진에 잡히면 안 된다.
    X-Robots-Tag = "noindex, nofollow"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  # 크로미움이 뜨는 서버라 1GB 로는 발행 중에 OOM 이 난다.
  memory = "2gb"
